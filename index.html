<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Mapa del Mundo Conocido</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=IM+Fell+English+SC&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="view"><canvas id="cv"></canvas></div>
    <div class="hud" id="tb">
      <button
        id="mnu"
        aria-expanded="false"
        aria-controls="dock"
        aria-label="Herramientas"
        title="Herramientas"
      >
        ☰
      </button>
      <button id="zi" aria-label="Acercar" title="Acercar">+</button
      ><button id="zo" aria-label="Alejar" title="Alejar">−</button
      ><button
        id="zr"
        aria-label="Ver todo el mapa"
        title="Ver todo el mapa"
        style="font-size: 22px"
      >
        ⌂</button
      ><span id="pct">100%</span>
    </div>
    <div class="hud" id="dock" hidden>
      <div id="tabs" role="tablist" aria-label="Herramientas">
        <button role="tab" data-t="ver">Ver</button
        ><button role="tab" data-t="marc">Marcas</button
        ><button role="tab" data-t="ruta">Ruta</button
        ><button role="tab" data-t="bio">Biomas</button
        ><button
          role="tab"
          data-t="cfg"
          aria-label="Rendimiento"
          title="Rendimiento"
        >
          ⚙
        </button>
      </div>
      <section data-p="ver">
        <button class="btn" id="mode" style="width: 100%">Ver en color</button>
        <hr />
        <input
          type="search"
          id="q"
          list="places"
          placeholder="Buscar lugar o marcador…"
          autocomplete="off"
          aria-label="Buscar lugar"
        />
        <datalist id="places"></datalist>
        <hr />
        <label><input type="checkbox" data-v="mini" /> Minimapa</label>
        <label
          ><input type="checkbox" data-v="scalebar" /> Barra de escala</label
        >
        <label
          ><input type="checkbox" data-v="markers" /> Mostrar marcadores</label
        >
        <label
          ><input type="checkbox" data-v="hover" /> Bioma bajo el cursor</label
        >
        <label
          ><input type="checkbox" data-opt="labels" /> Nombres y
          etiquetas</label
        >
        <button class="btn" id="fs" style="width: 100%; margin-top: 6px">
          Pantalla completa
        </button>
      </section>
      <section data-p="marc" hidden>
        <div class="row">
          <button class="btn" id="tMark" aria-pressed="false">
            📍 Colocar marcador
          </button>
        </div>
        <p class="small" id="mHelp">
          Pulsa el botón y toca el mapa. Toca un marcador para editarlo.
        </p>
        <ul id="mList" aria-label="Marcadores"></ul>
        <hr />
        <div class="row">
          <button class="btn" id="exp">Exportar</button
          ><label
            class="btn"
            style="display: block; text-align: center; flex: 1; margin: 0"
            >Importar<input
              type="file"
              id="imp"
              accept="application/json,.json"
              hidden
          /></label>
        </div>
        <div class="row">
          <button class="btn" id="mClear">Borrar todos</button>
        </div>
      </section>
      <section data-p="ruta" hidden>
        <div class="row">
          <button class="btn" id="tRoute" aria-pressed="false">
            🧭 Trazar ruta
          </button>
        </div>
        <p class="small" id="rSum">Añade al menos dos puntos.</p>
        <ul id="rList" aria-label="Puntos de la ruta"></ul>
        <div class="row">
          <button class="btn" id="rUndo">Deshacer</button
          ><button class="btn" id="rRev">Invertir</button
          ><button class="btn" id="rClear">Borrar</button>
        </div>
        <hr />
        <div class="row">
          <span>1 unidad =</span
          ><input
            type="number"
            id="scale"
            min="0.001"
            step="any"
            aria-label="Escala"
          /><select id="unit" aria-label="Unidad" style="width: auto">
            <option>leguas</option>
            <option>km</option>
            <option>millas</option>
          </select>
        </div>
      </section>
      <section data-p="bio" hidden>
        <p class="small">
          Toca un bioma para resaltarlo en el mapa; vuelve a tocarlo para
          quitarlo.
        </p>
        <div id="bList"></div>
      </section>
      <section data-p="cfg" id="cfg" hidden>
        <h2>Rendimiento</h2>
        <div class="seg" id="qSeg" role="radiogroup" aria-label="Calidad">
          <button role="radio" data-q="auto">Auto</button
          ><button role="radio" data-q="alta">Alta</button
          ><button role="radio" data-q="media">Media</button
          ><button role="radio" data-q="baja">Baja</button>
        </div>
        <p class="small" id="qDesc"></p>
        <hr />
        <label
          ><input type="checkbox" data-opt="details" /> Detalles del terreno
          (capas)</label
        >
        <label
          ><input type="checkbox" data-opt="paper" /> Textura de papel</label
        >
        <label><input type="checkbox" data-opt="fx" /> Sombras y manchas</label>
        <label
          ><input type="checkbox" data-opt="smooth" /> Movimiento suave</label
        >
        <hr />
        <label
          ><input type="checkbox" data-opt="preload" /> Precargar el mapa al
          abrir</label
        >
        <label
          ><input type="checkbox" data-opt="premax" /> Precarga máxima (usa más
          memoria)</label
        >
        <hr />
        <label
          ><input type="checkbox" data-opt="stats" /> Mostrar rendimiento</label
        >
      </section>
    </div>
    <div class="hud" id="chip" hidden>
      <span id="chipTxt"></span><button id="chipOk">Listo</button>
    </div>
    <div class="hud" id="pop" hidden role="dialog" aria-label="Editar marcador">
      <input
        id="pName"
        maxlength="40"
        placeholder="Nombre"
        aria-label="Nombre del marcador"
      />
      <div id="pIcons"></div>
      <textarea
        id="pNote"
        rows="2"
        maxlength="200"
        placeholder="Nota (opcional)"
        aria-label="Nota"
      ></textarea>
      <div class="row">
        <button id="pGo">Centrar</button><button id="pDel">Borrar</button
        ><button id="pOk">Listo</button>
      </div>
    </div>
    <div class="hud" id="tip" hidden></div>
    <canvas class="hud" id="mini" hidden aria-label="Minimapa"></canvas>
    <div class="hud" id="stats" hidden></div>
    <div class="hud" id="toast" hidden></div>
    <div class="hud" id="hint">Rueda para acercar · arrastra para moverte</div>
    <div id="load">
      <div>
        <div id="loadTxt">Dibujando el mapa…</div>
        <div id="bar"><i></i></div>
        <button id="skip" hidden>Entrar ya</button>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
