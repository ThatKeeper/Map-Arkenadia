<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mapa del Mundo Conocido</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
<style>
:root{--ink:#3b2a1a;--hud:#ead7ab;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;overflow:hidden;background:#1d130b;font-family:'Caveat',cursive,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent}
#view{position:absolute;inset:0;cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#view.drag{cursor:grabbing}
.hud{position:absolute;z-index:5;background:var(--hud);border:2px solid var(--ink);border-radius:6px 10px 7px 9px;box-shadow:3px 4px 0 rgba(0,0,0,.35)}
#hint{left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));padding:8px 14px;font-size:22px;max-width:60vw}
#stats{left:16px;bottom:calc(96px + env(safe-area-inset-bottom,0px));padding:4px 10px;font:600 17px/1.25 ui-monospace,Menlo,Consolas,monospace;max-width:calc(100vw - 100px);white-space:pre-line}
#toast{left:50%;transform:translateX(-50%);top:calc(16px + env(safe-area-inset-top,0px));padding:8px 16px;font-size:22px;max-width:calc(100vw - 150px);text-align:center;transition:opacity .4s;pointer-events:none}

.hud button,.hud select,.hud input,.hud textarea{font-family:'Caveat',cursive;color:var(--ink)}
#tb{left:max(12px,env(safe-area-inset-left,0px));top:calc(12px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:4px;padding:5px 6px}
#tb button{width:40px;height:40px;font:700 26px 'Caveat',cursive;background:transparent;border:2px dashed var(--ink);border-radius:8px;cursor:pointer;padding:0;line-height:1}
#tb button:hover,#dock button:hover,#pop button:hover,#chip button:hover{background:#f3e4bd}
#tb button[aria-expanded=true]{background:var(--ink);color:var(--hud);border-style:solid}
#pct{font-size:20px;min-width:46px;text-align:center}
.hud button:focus-visible,.hud input:focus-visible,.hud select:focus-visible,.hud textarea:focus-visible{outline:3px solid #6b2e1c;outline-offset:2px}
#dock{left:max(12px,env(safe-area-inset-left,0px));top:calc(12px + env(safe-area-inset-top,0px) + 58px);width:min(330px,calc(100vw - 24px));max-height:calc(100% - 150px);overflow:auto;padding:8px 12px 12px;font-size:21px;line-height:1.15}
#dock[hidden],#stats[hidden],#toast[hidden],#chip[hidden],#pop[hidden],#tip[hidden],#mini[hidden]{display:none}
#tabs{display:flex;gap:3px;margin-bottom:8px}
#tabs button{flex:1;font:700 19px 'Caveat',cursive;background:transparent;border:2px dashed var(--ink);border-radius:8px;padding:3px 0;cursor:pointer}
#tabs button[aria-selected=true]{background:var(--ink);color:var(--hud);border-style:solid}
#dock section[hidden]{display:none}
#dock h2{margin:0 0 6px;font:700 24px 'Caveat',cursive}
#dock .seg{display:flex;gap:4px;margin-bottom:6px}
#dock .seg button{flex:1;font:700 20px 'Caveat',cursive;background:transparent;border:2px dashed var(--ink);border-radius:8px;padding:3px 2px;cursor:pointer}
#dock .seg button[aria-checked=true]{background:var(--ink);color:var(--hud);border-style:solid}
#dock .small{margin:0 0 8px;font-size:18px;opacity:.85}
#dock label{display:flex;align-items:center;gap:10px;padding:4px 0;cursor:pointer}
#dock input[type=checkbox]{width:21px;height:21px;accent-color:#6b2e1c;flex:none}
#dock hr{border:0;border-top:2px dashed var(--ink);opacity:.35;margin:8px 0}
#dock .btn,#pop button,#chip button{font:700 20px 'Caveat',cursive;background:transparent;border:2px dashed var(--ink);border-radius:8px;padding:4px 10px;cursor:pointer}
#dock .btn[aria-pressed=true]{background:var(--ink);color:var(--hud);border-style:solid}
#dock .row,#pop .row{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0;align-items:center}
#dock .row .btn{flex:1;min-width:0}
#dock input[type=text],#dock input[type=search],#dock input[type=number],#dock select,#pop input,#pop textarea{width:100%;box-sizing:border-box;font:500 20px 'Caveat',cursive;background:#f6ead0;border:2px solid var(--ink);border-radius:6px;padding:4px 8px}
#dock input[type=number]{width:90px}
#dock ul{list-style:none;margin:6px 0;padding:0;max-height:190px;overflow:auto}
#dock li{display:flex;gap:4px;align-items:center;padding:2px 0}
#dock li>button:first-child{flex:1;text-align:left;font:500 20px 'Caveat',cursive;background:transparent;border:0;border-bottom:1px dotted var(--ink);padding:3px 2px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#dock li>button+button{font:700 18px 'Caveat',cursive;background:transparent;border:1px dashed var(--ink);border-radius:6px;cursor:pointer}
#dock li.empty{opacity:.7}
.bio{display:flex;width:100%;align-items:center;gap:8px;background:transparent;border:2px dashed transparent;border-radius:8px;padding:4px 6px;font:500 21px 'Caveat',cursive;cursor:pointer;text-align:left}
.bio i{width:22px;height:22px;border:2px solid var(--ink);border-radius:5px;flex:none}
.bio span{flex:1}.bio em{font-style:normal;opacity:.7;font-size:18px}
.bio[aria-pressed=true]{border-color:var(--ink);background:#f3e4bd}
#chip{left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));padding:6px 12px;font-size:21px;display:flex;gap:10px;align-items:center;max-width:calc(100vw - 24px);text-align:center}
#pop{left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(360px,calc(100vw - 24px));padding:10px 12px;z-index:7;display:flex;flex-direction:column;gap:6px}
#pIcons{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
#pIcons button{font-size:22px;padding:2px 0;border:2px dashed var(--ink);background:transparent;border-radius:8px;cursor:pointer}
#pIcons button[aria-pressed=true]{background:var(--ink);border-style:solid}
#tip{pointer-events:none;padding:4px 10px;font-size:20px;white-space:nowrap;z-index:6}
#mini{right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));padding:0;cursor:pointer;touch-action:none;border-width:2px}
#hint{left:max(12px,env(safe-area-inset-left,0px))}
#load{position:absolute;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;background:#1d130b;color:#ead7ab;font-size:40px;text-align:center;padding:0 20px}
#load>div{display:flex;flex-direction:column;align-items:center;gap:14px}
#bar{width:min(320px,70vw);height:12px;border:2px solid #ead7ab;border-radius:8px;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:#ead7ab;transition:width .15s}
#skip{font:700 24px 'Caveat',cursive;color:#ead7ab;background:transparent;border:2px dashed #ead7ab;border-radius:8px;padding:4px 18px;cursor:pointer}
</style></head><body>
<div id="view"><canvas id="cv"></canvas></div>
<div class="hud" id="tb">
 <button id="mnu" aria-expanded="false" aria-controls="dock" aria-label="Herramientas" title="Herramientas">☰</button>
 <button id="zi" aria-label="Acercar" title="Acercar">+</button><button id="zo" aria-label="Alejar" title="Alejar">−</button><button id="zr" aria-label="Ver todo el mapa" title="Ver todo el mapa" style="font-size:22px">⌂</button><span id="pct">100%</span>
</div>
<div class="hud" id="dock" hidden>
 <div id="tabs" role="tablist" aria-label="Herramientas">
  <button role="tab" data-t="ver">Ver</button><button role="tab" data-t="marc">Marcas</button><button role="tab" data-t="ruta">Ruta</button><button role="tab" data-t="bio">Biomas</button><button role="tab" data-t="cfg" aria-label="Rendimiento" title="Rendimiento">⚙</button>
 </div>
 <section data-p="ver">
  <button class="btn" id="mode" style="width:100%">Ver en color</button>
  <hr>
  <input type="search" id="q" list="places" placeholder="Buscar lugar o marcador…" autocomplete="off" aria-label="Buscar lugar">
  <datalist id="places"></datalist>
  <hr>
  <label><input type="checkbox" data-v="mini"> Minimapa</label>
  <label><input type="checkbox" data-v="scalebar"> Barra de escala</label>
  <label><input type="checkbox" data-v="markers"> Mostrar marcadores</label>
  <label><input type="checkbox" data-v="hover"> Bioma bajo el cursor</label>
  <label><input type="checkbox" data-opt="labels"> Nombres y etiquetas</label>
  <button class="btn" id="fs" style="width:100%;margin-top:6px">Pantalla completa</button>
 </section>
 <section data-p="marc" hidden>
  <div class="row"><button class="btn" id="tMark" aria-pressed="false">📍 Colocar marcador</button></div>
  <p class="small" id="mHelp">Pulsa el botón y toca el mapa. Toca un marcador para editarlo.</p>
  <ul id="mList" aria-label="Marcadores"></ul>
  <hr>
  <div class="row"><button class="btn" id="exp">Exportar</button><label class="btn" style="display:block;text-align:center;flex:1;margin:0">Importar<input type="file" id="imp" accept="application/json,.json" hidden></label></div>
  <div class="row"><button class="btn" id="mClear">Borrar todos</button></div>
 </section>
 <section data-p="ruta" hidden>
  <div class="row"><button class="btn" id="tRoute" aria-pressed="false">🧭 Trazar ruta</button></div>
  <p class="small" id="rSum">Añade al menos dos puntos.</p>
  <ul id="rList" aria-label="Puntos de la ruta"></ul>
  <div class="row"><button class="btn" id="rUndo">Deshacer</button><button class="btn" id="rRev">Invertir</button><button class="btn" id="rClear">Borrar</button></div>
  <hr>
  <div class="row"><span>1 unidad =</span><input type="number" id="scale" min="0.001" step="any" aria-label="Escala"><select id="unit" aria-label="Unidad" style="width:auto"><option>leguas</option><option>km</option><option>millas</option></select></div>
 </section>
 <section data-p="bio" hidden>
  <p class="small">Toca un bioma para resaltarlo en el mapa; vuelve a tocarlo para quitarlo.</p>
  <div id="bList"></div>
 </section>
 <section data-p="cfg" id="cfg" hidden>
  <h2>Rendimiento</h2>
  <div class="seg" id="qSeg" role="radiogroup" aria-label="Calidad">
   <button role="radio" data-q="auto">Auto</button><button role="radio" data-q="alta">Alta</button><button role="radio" data-q="media">Media</button><button role="radio" data-q="baja">Baja</button>
  </div>
  <p class="small" id="qDesc"></p>
  <hr>
  <label><input type="checkbox" data-opt="details"> Detalles del terreno (capas)</label>
  <label><input type="checkbox" data-opt="paper"> Textura de papel</label>
  <label><input type="checkbox" data-opt="fx"> Sombras y manchas</label>
  <label><input type="checkbox" data-opt="smooth"> Movimiento suave</label>
  <hr>
  <label><input type="checkbox" data-opt="preload"> Precargar el mapa al abrir</label>
  <label><input type="checkbox" data-opt="premax"> Precarga máxima (usa más memoria)</label>
  <hr>
  <label><input type="checkbox" data-opt="stats"> Mostrar rendimiento</label>
 </section>
</div>
<div class="hud" id="chip" hidden><span id="chipTxt"></span><button id="chipOk">Listo</button></div>
<div class="hud" id="pop" hidden role="dialog" aria-label="Editar marcador">
 <input id="pName" maxlength="40" placeholder="Nombre" aria-label="Nombre del marcador">
 <div id="pIcons"></div>
 <textarea id="pNote" rows="2" maxlength="200" placeholder="Nota (opcional)" aria-label="Nota"></textarea>
 <div class="row"><button id="pGo">Centrar</button><button id="pDel">Borrar</button><button id="pOk">Listo</button></div>
</div>
<div class="hud" id="tip" hidden></div>
<canvas class="hud" id="mini" hidden aria-label="Minimapa"></canvas>
<div class="hud" id="stats" hidden></div>
<div class="hud" id="toast" hidden></div>
<div class="hud" id="hint">Rueda para acercar · arrastra para moverte</div>
<div id="load"><div><div id="loadTxt">Dibujando el mapa…</div><div id="bar"><i></i></div><button id="skip" hidden>Entrar ya</button></div></div>
<script>
/* ════════════════════════════════════════════════════════════════════
   NÚCLEO DE GEOMETRÍA  (corre en un Web Worker; si no hay worker, en el hilo
   principal por pasos). No toca el DOM ni el canvas: solo calcula.
   ════════════════════════════════════════════════════════════════════ */
function makeCore(){
 const W=2400,H=1848,GW=600,GH=462,BK=[6,7,8,10,11,4,5,9];
 let seed=11;const rnd=()=>(seed=seed*16807%2147483647,(seed-1)/2147483646);
 const mkT=()=>Array.from({length:4096},rnd),T1=mkT(),T2=mkT(),sm=t=>t*t*(3-2*t);
 function vn(T,x,y){const xi=Math.floor(x),yi=Math.floor(y),u=sm(x-xi),v=sm(y-yi),g=(a,b)=>T[(b&63)*64+(a&63)];
  return (g(xi,yi)*(1-u)+g(xi+1,yi)*u)*(1-v)+(g(xi,yi+1)*(1-u)+g(xi+1,yi+1)*u)*v}
 function fbm(T,x,y){return (.5*vn(T,x,y)+.25*vn(T,x*2,y*2)+.125*vn(T,x*4,y*4))/.875}
 let CLS=null,FA=null,bufs={};
 function blur(a,w,h,r,p){const b=new Float32Array(a.length),n=2*r+1,cx=(v,m)=>Math.min(m-1,Math.max(0,v));
  for(let k=0;k<p;k++){
   for(let y=0;y<h;y++){let s=0;const o=y*w;for(let x=-r;x<=r;x++)s+=a[o+cx(x,w)];for(let x=0;x<w;x++){b[o+x]=s/n;s+=a[o+cx(x+r+1,w)]-a[o+cx(x-r,w)]}}
   for(let x=0;x<w;x++){let s=0;for(let y=-r;y<=r;y++)s+=b[cx(y,h)*w+x];for(let y=0;y<h;y++){a[y*w+x]=s/n;s+=b[cx(y+r+1,h)*w+x]-b[cx(y-r,h)*w+x]}}}
  return a}
 /* Marching squares → lazos suavizados (Chaikin). Devuelve {pts:Float32Array(x,y…), lens:Int32Array} */
 function contour(f,w,h,L,sc,it){
  const W2=w+3,N=(h+3)*W2*2;
  let B=bufs[N];if(!B)bufs[N]=B={PX:new Float32Array(N),PY:new Float32Array(N),A1:new Int32Array(N),A2:new Int32Array(N),vis:new Uint8Array(N)};
  const PX=B.PX,PY=B.PY,A1=B.A1,A2=B.A2,vis=B.vis;A1.fill(-1);A2.fill(-1);vis.fill(0);
  const used=[];
  const g=(x,y)=>x<0||y<0||x>=w||y>=h?0:f[y*w+x],eH=(x,y)=>((y+1)*W2+x+1)*2,eV=(x,y)=>eH(x,y)+1;
  const link=(a,b)=>{if(A1[a]<0){A1[a]=b;used.push(a)}else A2[a]=b;if(A1[b]<0){A1[b]=a;used.push(b)}else A2[b]=a};
  for(let y=-1;y<h;y++)for(let x=-1;x<w;x++){
   const a=g(x,y),b=g(x+1,y),c=g(x+1,y+1),d=g(x,y+1),i=(a>=L)*8+(b>=L)*4+(c>=L)*2+(d>=L);if(i===0||i===15)continue;
   const T=eH(x,y),R=eV(x+1,y),Bt=eH(x,y+1),Lf=eV(x,y);
   if((a>=L)!==(b>=L)){PX[T]=x+(L-a)/(b-a);PY[T]=y}
   if((b>=L)!==(c>=L)){PX[R]=x+1;PY[R]=y+(L-b)/(c-b)}
   if((d>=L)!==(c>=L)){PX[Bt]=x+(L-d)/(c-d);PY[Bt]=y+1}
   if((a>=L)!==(d>=L)){PX[Lf]=x;PY[Lf]=y+(L-a)/(d-a)}
   switch(i){case 1:case 14:link(Lf,Bt);break;case 2:case 13:link(Bt,R);break;case 3:case 12:link(Lf,R);break;case 4:case 11:link(T,R);break;case 6:case 9:link(T,Bt);break;case 7:case 8:link(T,Lf);break;
    default:{const m=(a+b+c+d)/4>=L;if((i===5)===m){link(T,Lf);link(R,Bt)}else{link(T,R);link(Lf,Bt)}}}}
  const nu=e=>e>=0&&!vis[e],out=[],lens=[];
  for(const s0 of used){if(vis[s0])continue;let pts=[],cur=s0;
   while(cur>=0){vis[cur]=1;pts.push(PX[cur],PY[cur]);cur=nu(A1[cur])?A1[cur]:(nu(A2[cur])?A2[cur]:-1)}
   let n=pts.length>>1;if(n<4)continue;
   for(let k=0;k<it;k++){const q=new Array(n*4);
    for(let i=0;i<n;i++){const j=((i+1)%n)*2,i2=i*2,ax=pts[i2],ay=pts[i2+1],bx=pts[j],by=pts[j+1];
     q[i*4]=.75*ax+.25*bx;q[i*4+1]=.75*ay+.25*by;q[i*4+2]=.25*ax+.75*bx;q[i*4+3]=.25*ay+.75*by}
    pts=q;n*=2}
   for(let i=0;i<n;i++)out.push((pts[i*2]+.5)*sc,(pts[i*2+1]+.5)*sc);
   lens.push(n)}
  return {pts:Float32Array.from(out),lens:Int32Array.from(lens)}}
 /* Campo ×2 con ruido (calidad alta) y campo ×1 con el mismo ruido (calidad baja) */
 function up2(a){const w=GW*2,h=GH*2,f=new Float32Array(w*h);
  for(let y=0;y<h;y++){const fy=Math.max(0,Math.min(GH-1.001,(y+.5)/2-.5)),y0=fy|0,ty=fy-y0;
   for(let x=0;x<w;x++){const fx=Math.max(0,Math.min(GW-1.001,(x+.5)/2-.5)),x0=fx|0,tx=fx-x0,i=y0*GW+x0;
    f[y*w+x]=(a[i]*(1-tx)+a[i+1]*tx)*(1-ty)+(a[i+GW]*(1-tx)+a[i+GW+1]*tx)*ty+(fbm(T1,x*.06,y*.06)-.5)*.1+(vn(T2,x*.35,y*.35)-.5)*.05}}
  return f}
 function up1(a){const f=new Float32Array(GW*GH);
  for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){const X=x*2+.5,Y=y*2+.5;
   f[y*GW+x]=a[y*GW+x]+(fbm(T1,X*.06,Y*.06)-.5)*.1+(vn(T2,X*.35,Y*.35)-.5)*.05}
  return f}
 const tick0=()=>Promise.resolve();
 return {
  init(cls){CLS=cls},
  async geo(q,tick){tick=tick||tick0;
   const VAL=[.06,.22,.38,.46],raw=new Float32Array(GW*GH);
   for(let i=0;i<raw.length;i++)raw[i]=CLS[i]<4?VAL[CLS[i]]:1;
   FA=blur(raw,GW,GH,2,3);await tick();
   const hi=q>=2,F=hi?up2(FA):up1(FA),w=hi?GW*2:GW,h=hi?GH*2:GH,sc=hi?2:4,geo={b:{}};
   await tick();
   for(const[n,L]of[['m',.14],['sh',.3],['lt',.42],['land',.7],['r1',.6],['r2',.52]]){geo[n]=contour(F,w,h,L,sc,1);await tick()}
   for(const k of BK){const ind=new Float32Array(GW*GH);for(let i=0;i<ind.length;i++)ind[i]=CLS[i]===k?1:0;blur(ind,GW,GH,1,k===9?1:2);geo.b[k]=contour(ind,GW,GH,.4,4,2);await tick()}
   bufs={};return geo},
  /* Capas de detalle (montañas, árboles, dunas…) por nivel de zoom. lod = nivel máximo, dens = densidad 0..1 */
  /* Capas de detalle por nivel de zoom. lod = nivel máximo, dens = densidad 0..1.
     Cada elemento reserva una huella elíptica; si choca con otra ya colocada (de cualquier nivel) se descarta. */
  items(lod,dens){
   const LV=[{st:16,sz:1},{st:8,sz:.6},{st:4.4,sz:.36},{st:2.6,sz:.2}],res=[];
   const CL=(x,y)=>CLS[Math.min(GH-1,y/4|0)*GW+Math.min(GW-1,x/4|0)],FAat=(x,y)=>FA[Math.min(GH-1,y/4|0)*GW+Math.min(GW-1,x/4|0)];
   const CELL=24,K2=.72,grid=new Map(),ex=[],ey=[],erx=[],ery=[],et=[];
   const foot=(t,x,y,z)=>t===1?[x+.05*z,y-.75*z,1.05*z,.75*z]:t===2?[x,y-6*z,4*z,6.5*z]:t===4?[x,y-3.5*z,6*z,3.5*z]:t===5?[x,y-3*z,2*z,3*z]:t===6?[x,y,.9*z,.9*z]:[x+14*z,y,14*z,4*z];
   const free=(f,t)=>{const cx=f[0],cy=f[1],rx=f[2],ry=f[3],i0=Math.floor((cx-rx-20)/CELL),i1=Math.floor((cx+rx+20)/CELL),j0=Math.floor((cy-ry-14)/CELL),j1=Math.floor((cy+ry+14)/CELL);
    for(let j=j0;j<=j1;j++)for(let i=i0;i<=i1;i++){const a=grid.get(j*4096+i);if(!a)continue;
     for(const id of a){if((t===7)!==(et[id]===7))continue;const dx=(cx-ex[id])/(rx+erx[id]),dy=(cy-ey[id])/(ry+ery[id]);if(dx*dx+dy*dy<K2)return false}}
    return true};
   const add=(f,t)=>{const id=ex.length;ex.push(f[0]);ey.push(f[1]);erx.push(f[2]);ery.push(f[3]);et.push(t);
    const key=Math.floor(f[1]/CELL)*4096+Math.floor(f[0]/CELL);let a=grid.get(key);if(!a)grid.set(key,a=[]);a.push(id)};
   for(let l=0;l<4;l++){

 for(const m of DATA.markers){const li=mk('li'),b=mk('button',ICONS[m.i][0]+' '+m.n);b.onclick=()=>{flyTo(m.x,m.y,Math.max(ts,fit*2.5));openPop(m.id)};li.appendChild(b);ul.appendChild(li)}
 const dl=$('places');dl.textContent='';const seen=new Set();
 for(const l of LB)if(l[3]!=='n'&&!seen.has(l[0])){seen.add(l[0]);const o=document.createElement('option');o.value=l[0];dl.appendChild(o)}
 for(const m of DATA.markers)if(!seen.has(m.n)){seen.add(m.n);const o=document.createElement('option');o.value=m.n;dl.appendChild(o)}}
const getM=id=>DATA.markers.find(m=>m.id===id);
function addMarker(x,y){const m={id:DATA.nid++,x:Math.round(x),y:Math.round(y),n:'Marcador '+(DATA.markers.length+1),i:0,t:''};DATA.markers.push(m);saveData();renderMarks();openPop(m.id)}
function openPop(id){const m=getM(id);if(!m)return;sel=id;$('pName').value=m.n;$('pNote').value=m.t;
 for(const b of $('pIcons').children)b.setAttribute('aria-pressed',String(+b.dataset.i===m.i));$('pop').hidden=false;invalidate()}
function closePop(){$('pop').hidden=true;sel=null;invalidate()}
function hitMarker(cx,cy){let best=null,bd=22;if(!VIEW.markers)return null;
 for(const m of DATA.markers){const[x,y]=w2s(m.x,m.y),d=Math.hypot(cx-x,cy-(y-16));if(d<bd){bd=d;best=m}}return best}
/* — ruta — */
function routeStats(){const R=DATA.route,legs=[];let tot=0,land=0,sea=0;
 for(let i=1;i<R.length;i++){const a=R[i-1],b=R[i],d=Math.hypot(b.x-a.x,b.y-a.y),n=Math.max(1,Math.ceil(d/3));let l=0;
  for(let j=0;j<n;j++){const t=(j+.5)/n;if(clsAt(a.x+(b.x-a.x)*t,a.y+(b.y-a.y)*t)>=4)l++}
  const ld=d*l/n;legs.push({d,land:ld,sea:d-ld});tot+=d;land+=ld;sea+=d-ld}
 return{legs,tot,land,sea}}
const fmt=v=>{v*=DATA.scale;return v.toLocaleString('es',{maximumFractionDigits:v<10?1:0})};
function renderRoute(){const R=DATA.route,st=routeStats(),ul=$('rList');ul.textContent='';let cum=0;
 R.forEach((p,i)=>{if(i)cum+=st.legs[i-1].d;const li=mk('li'),b=mk('button',(i+1)+'. '+(p.n||'Punto')+(i?'  +'+fmt(st.legs[i-1].d)+' · '+fmt(cum):''));
  b.onclick=()=>flyTo(p.x,p.y,Math.max(ts,fit*2));const x=mk('button','✕');x.setAttribute('aria-label','Quitar punto '+(i+1));x.onclick=()=>{R.splice(i,1);saveData();renderRoute();invalidate()};li.append(b,x);ul.appendChild(li)});
 $('rSum').textContent=R.length>1?'Total: '+fmt(st.tot)+' '+DATA.unit+' · tierra '+fmt(st.land)+' · mar '+fmt(st.sea):R.length?'Añade otro punto para medir.':'Añade al menos dos puntos.';
 $('scale').value=DATA.scale;$('unit').value=DATA.unit}
/* — biomas — */
let bioPct={};
function renderBio(){const box=$('bList');if(!box)return;box.textContent='';const h={};let land=0;for(let i=0;i<cls.length;i++){h[cls[i]]=(h[cls[i]]||0)+1;if(cls[i]>=4)land++}
 for(const k of BIOL){const b=mk('button',null,'bio'),sw=mk('i'),nm=mk('span',BIO[k]),pc=mk('em',land?(100*(h[k]||0)/land).toFixed(0)+' %':'');sw.style.background=PAL[mode].b[k];
  b.setAttribute('aria-pressed',String(HL===k));b.append(sw,nm,pc);b.onclick=()=>setHL(k);box.appendChild(b)}}
function setHL(k){HL=HL===k?null:k;gen++;overviewStale=true;buildPreQ();renderBio();invalidate()}
/* — información al tocar / pasar el cursor — */
let tipT=0;
function showTip(cx,cy,wx,wy,timed){const t=$('tip'),b=BIO[clsAt(wx,wy)];t.textContent=b+' · '+Math.round(wx)+', '+Math.round(wy);t.hidden=false;
 const r=t.getBoundingClientRect(),x=Math.min(cx+16,vw-r.width-8),y=Math.min(cy+18,vh-r.height-8);t.style.left=Math.max(8,x)+'px';t.style.top=Math.max(8,y)+'px';
 clearTimeout(tipT);if(timed)tipT=setTimeout(()=>t.hidden=true,2600)}
const hideTip=()=>{$('tip').hidden=true};
function handleTap(e){
 const r=view.getBoundingClientRect(),cx=e.clientX-r.left,cy=e.clientY-r.top,wx=(cx-tx)/s,wy=(cy-ty)/s;if(wx<0||wy<0||wx>W||wy>H)return;
 const hit=hitMarker(cx,cy);
 if(tool==='route'){DATA.route.push(hit?{x:hit.x,y:hit.y,n:hit.n}:{x:Math.round(wx),y:Math.round(wy),n:''});saveData();renderRoute();invalidate();return}
 if(tool==='marker'&&!hit){addMarker(wx,wy);return}
 if(hit){openPop(hit.id);return}
 showTip(cx,cy,wx,wy,true)}
/* — navegación — */
function flyTo(x,y,z){ts=clampZ(z);mpx=x;mpy=y;ax=tx+x*s;ay=ty+y*s;tax=vw/2;tay=vh/2;lastWheel=performance.now();invalidate()}
function centerOn(x,y){tx=vw/2-x*s;ty=vh/2-y*s;anchorAt(vw/2,vh/2);invalidate()}
function findPlace(q){q=q.trim().toLowerCase();if(!q)return null;let ex=null,pa=null;
 const all=[...DATA.markers.map(m=>({n:m.n,x:m.x,y:m.y,z:fit*2.5})),...LB.filter(l=>l[3]!=='n').map(l=>({n:l[0],x:l[1]*W,y:l[2]*H,z:fit*(l[3]==='c'?1.8:3.2)}))];
 for(const p of all){const n=p.n.toLowerCase();if(n===q){ex=p;break}if(!pa&&n.includes(q))pa=p}return ex||pa}
/* — dibujo sobre el mapa (pantalla, tamaño constante) — */
function drawUser(P){
 const dp=Q.dpr;ctx.setTransform(dp,0,0,dp,0,0);ctx.lineJoin='round';ctx.lineCap='round';
 const R=DATA.route;
 if(R.length){ctx.beginPath();R.forEach((p,i)=>{const[x,y]=w2s(p.x,p.y);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});
  ctx.strokeStyle='rgba(255,246,222,.85)';ctx.lineWidth=6;ctx.stroke();ctx.strokeStyle='#8c2a22';ctx.lineWidth=3;ctx.setLineDash([10,7]);ctx.stroke();ctx.setLineDash([]);
  ctx.font='700 14px Caveat,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  R.forEach((p,i)=>{const[x,y]=w2s(p.x,p.y);ctx.beginPath();ctx.arc(x,y,9,0,TAU);ctx.fillStyle='#8c2a22';ctx.fill();ctx.strokeStyle='#fff6de';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#fff6de';ctx.fillText(i+1,x,y+.5)})}
 if(VIEW.markers)for(const m of DATA.markers){const[x,y]=w2s(m.x,m.y);if(x<-40||y<-40||x>vw+40||y>vh+60)continue;const ic=ICONS[m.i],cy=y-20;
  ctx.beginPath();ctx.arc(x,cy,13,.75*Math.PI,2.25*Math.PI,false);ctx.lineTo(x,y);ctx.closePath();ctx.fillStyle=ic[1];ctx.fill();ctx.strokeStyle=m.id===sel?'#fff':'rgba(40,25,10,.9)';ctx.lineWidth=m.id===sel?3:2;ctx.stroke();
  ctx.beginPath();ctx.arc(x,cy,9,0,TAU);ctx.fillStyle='rgba(255,248,230,.93)';ctx.fill();
  ctx.font='14px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#000';ctx.fillText(ic[0],x,cy+1);
  ctx.font='600 19px Caveat,cursive';ctx.textAlign='left';ctx.lineWidth=4;ctx.strokeStyle=P.halo;ctx.strokeText(m.n,x+16,cy);ctx.fillStyle=P.txt;ctx.fillText(m.n,x+16,cy)}
 if(VIEW.scalebar){const sc=DATA.scale,tgt=110/s*sc,p10=Math.pow(10,Math.floor(Math.log10(tgt))),f=tgt/p10,nice=(f>=5?5:f>=2?2:1)*p10,px=nice/sc*s,bx=vw-14-px,by=vh-14-(VIEW.mini?MH+12:0);
  ctx.beginPath();ctx.moveTo(bx,by-6);ctx.lineTo(bx,by);ctx.lineTo(bx+px,by);ctx.lineTo(bx+px,by-6);ctx.strokeStyle='rgba(255,246,222,.9)';ctx.lineWidth=5;ctx.stroke();ctx.strokeStyle='#3b2a1a';ctx.lineWidth=2;ctx.stroke();
  ctx.font='600 18px Caveat,cursive';ctx.textAlign='center';ctx.textBaseline='bottom';const t=nice.toLocaleString('es')+' '+DATA.unit;ctx.lineWidth=4;ctx.strokeStyle='rgba(255,246,222,.9)';ctx.strokeText(t,bx+px/2,by-7);ctx.fillStyle='#3b2a1a';ctx.fillText(t,bx+px/2,by-7)}}
/* — minimapa — */
const MW=176,MH=Math.round(MW*(H+120)/(W+120)),mini=$('mini'),mctx=mini.getContext('2d');
function sizeMini(){const dp=Q.dpr;mini.width=Math.round(MW*dp);mini.height=Math.round(MH*dp);mini.style.width=MW+'px';mini.style.height=MH+'px'}
function syncView(){mini.hidden=!VIEW.mini;for(const i of document.querySelectorAll('#dock input[data-v]'))i.checked=!!VIEW[i.dataset.v]}
const m2x=x=>(x+60)/(W+120)*MW,m2y=y=>(y+60)/(H+120)*MH;
function drawMini(){
 if(!VIEW.mini||!ready)return;const dp=Q.dpr;mctx.setTransform(dp,0,0,dp,0,0);mctx.fillStyle='#1d130b';mctx.fillRect(0,0,MW,MH);
 if(overview)mctx.drawImage(overview.cv,0,0,MW,MH);
 if(DATA.route.length>1){mctx.beginPath();DATA.route.forEach((p,i)=>i?mctx.lineTo(m2x(p.x),m2y(p.y)):mctx.moveTo(m2x(p.x),m2y(p.y)));mctx.strokeStyle='#8c2a22';mctx.lineWidth=1.5;mctx.stroke()}
 if(VIEW.markers)for(const m of DATA.markers){mctx.beginPath();mctx.arc(m2x(m.x),m2y(m.y),2.6,0,TAU);mctx.fillStyle=ICONS[m.i][1];mctx.fill();mctx.strokeStyle='#fff';mctx.lineWidth=1;mctx.stroke()}
 const x0=m2x(-tx/s),y0=m2y(-ty/s),x1=m2x((vw-tx)/s),y1=m2y((vh-ty)/s);
 mctx.fillStyle='rgba(255,255,255,.14)';mctx.fillRect(x0,y0,x1-x0,y1-y0);mctx.strokeStyle='rgba(255,244,214,.95)';mctx.lineWidth=1.5;mctx.strokeRect(x0,y0,x1-x0,y1-y0)}
let miniDrag=false;
const miniGo=e=>{const r=mini.getBoundingClientRect();centerOn((e.clientX-r.left)/MW*(W+120)-60,(e.clientY-r.top)/MH*(H+120)-60)};
mini.addEventListener('pointerdown',e=>{miniDrag=true;mini.setPointerCapture(e.pointerId);miniGo(e)});
mini.addEventListener('pointermove',e=>{if(miniDrag)miniGo(e)});
mini.addEventListener('pointerup',()=>miniDrag=false);mini.addEventListener('pointercancel',()=>miniDrag=false);

function initTools(){
 for(const[i,ic]of ICONS.entries()){const b=mk('button',ic[0]);b.dataset.i=i;b.setAttribute('aria-label','Icono '+(i+1));b.onclick=()=>{const m=getM(sel);if(!m)return;m.i=i;saveData();renderMarks();openPop(m.id)};$('pIcons').appendChild(b)}
 $('mnu').onclick=()=>$('dock').hidden?openDock():closeDock();
 $('tabs').onclick=e=>{const b=e.target.closest('button');if(b)setTab(b.dataset.t)};
 let t0='ver';try{t0=sessionStorage.getItem('mapaTab')||'ver'}catch(e){}setTab(t0);
 $('tMark').onclick=()=>setTool('marker');$('tRoute').onclick=()=>setTool('route');$('chipOk').onclick=()=>setTool(null);
 $('pName').oninput=e=>{const m=getM(sel);if(!m)return;m.n=e.target.value||'Marcador';saveData();renderMarks();invalidate()};
 $('pNote').oninput=e=>{const m=getM(sel);if(!m)return;m.t=e.target.value;saveData()};
 $('pOk').onclick=closePop;$('pGo').onclick=()=>{const m=getM(sel);if(m)flyTo(m.x,m.y,Math.max(ts,fit*2.5))};
 $('pDel').onclick=()=>{DATA.markers=DATA.markers.filter(m=>m.id!==sel);saveData();renderMarks();closePop()};
 $('mClear').onclick=()=>{if(DATA.markers.length&&confirm('¿Borrar todos los marcadores?')){DATA.markers=[];saveData();renderMarks();closePop()}};
 $('rUndo').onclick=()=>{DATA.route.pop();saveData();renderRoute();invalidate()};
 $('rRev').onclick=()=>{DATA.route.reverse();saveData();renderRoute();invalidate()};
 $('rClear').onclick=()=>{DATA.route=[];saveData();renderRoute();invalidate()};
 $('scale').onchange=e=>{const v=parseFloat(e.target.value);if(v>0&&v<1e6){DATA.scale=v;saveData();renderRoute();invalidate()}else e.target.value=DATA.scale};
 $('unit').onchange=e=>{DATA.unit=e.target.value;saveData();renderRoute();invalidate()};
 $('exp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(DATA,null,1)],{type:'application/json'}));a.download='mapa-datos.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)};
 $('imp').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{const d=sanitize(JSON.parse(await f.text()));if(!d.markers.length&&!d.route.length)throw 0;
   if(DATA.markers.length||DATA.route.length)if(!confirm('Esto reemplaza tus marcadores y ruta actuales. ¿Continuar?'))return;DATA=d;saveData();renderMarks();renderRoute();closePop();invalidate();toast('Datos importados')}catch(err){toast('Archivo no válido')}};
 const go=()=>{const p=findPlace($('q').value);if(p){flyTo(p.x,p.y,p.z);if(innerWidth<700)closeDock()}else toast('No encontré ese lugar')};
 $('q').onchange=go;$('q').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();go()}};
 const fs=$('fs');if(!document.documentElement.requestFullscreen)fs.hidden=true;fs.onclick=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{})};
 view.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse'||Pt.size||!VIEW.hover||!ready||tool){if(Pt.size)hideTip();return}
  const r=view.getBoundingClientRect(),cx=e.clientX-r.left,cy=e.clientY-r.top,wx=(cx-tx)/s,wy=(cy-ty)/s;
  if(wx<0||wy<0||wx>W||wy>H||hitMarker(cx,cy)){hideTip();return}showTip(cx,cy,wx,wy,false)});
 view.addEventListener('pointerleave',hideTip);
 syncView();renderMarks();renderRoute();renderBio();sizeMini()}

/* ─── Arranque ─── */
computeQ();maxTiles=Q.maxTiles;updateUI();initTools();resizeCanvas();resize();startWorker();
document.fonts&&Promise.all([document.fonts.load('50px "IM Fell English SC"'),document.fonts.load('500 30px Caveat'),document.fonts.load('700 70px Caveat')]).catch(()=>{}).then(()=>{LC.clear();invalidate()});
const im=new Image();
im.onload=()=>{const t=document.createElement('canvas');t.width=GW;t.height=GH;const x=t.getContext('2d',{willReadFrequently:true});x.drawImage(im,0,0);const d=x.getImageData(0,0,GW,GH).data;
 for(let i=0;i<GW*GH;i++)cls[i]=Math.round(d[i*4]/16);
 renderBio();setTimeout(requestBuild,10)};
im.onerror=()=>{const l=$('load');if(l)l.textContent='No se pudo leer el mapa'};
im.src=IMG;
</script></body></html>
